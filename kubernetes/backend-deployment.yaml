apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-backend
  namespace: task-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-manager-backend
  template:
    metadata:
      labels:
        app: task-manager-backend
    spec:
      containers:
        - name: backend
          image: task-manager-backend:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/tasks/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager-backend
  namespace: task-manager
spec:
  selector:
    app: task-manager-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
